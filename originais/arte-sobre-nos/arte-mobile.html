<!doctype html><html lang="pt-BR"><head><meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="icons.js"></script><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 600px; height: 1100px; overflow: hidden; }
  body { font-family: Inter, system-ui, sans-serif; }
  .stage {
    position: relative; width: 600px; height: 1100px; overflow: hidden;
    background:
      radial-gradient(circle at 8% 0%, rgba(0,217,255,.20), transparent 32%),
      radial-gradient(circle at 95% 5%, rgba(59,130,246,.16), transparent 36%),
      radial-gradient(circle at 50% 110%, rgba(15,58,125,.20), transparent 50%),
      linear-gradient(135deg, #edf6ff 0%, #f5f8fc 45%, #e4edf9 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(15,58,125,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,58,125,.055) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 45%, #000 20%, transparent 80%);
  }
  .dots { position: absolute; width: 120px; height: 72px;
    background-image: radial-gradient(#3b82f6 1.6px, transparent 1.8px); background-size: 14px 14px; opacity: .45; }
  svg.icon { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Cabeçalho */
  .brand { position: absolute; left: 36px; top: 26px; display: flex; align-items: center; gap: 12px; }
  .brand img { width: 52px; height: 52px; }
  .brand b { display: block; font-family: Poppins; font-weight: 800; font-size: 24px; letter-spacing: .06em; color: #0F3A7D; }
  .brand span { font-size: 15px; color: #3c5a86; font-weight: 500; }
  .trajetoria { position: absolute; right: 36px; top: 36px; display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .trajetoria .antes { color: #6b7f9e; font-weight: 500; }
  .trajetoria .antes b { color: #4f6687; font-weight: 700; }
  .trajetoria .seta { width: 44px; height: 2px; background: linear-gradient(90deg, #9fb3cf, #00b8e6); position: relative; }
  .trajetoria .seta::after { content: ""; position: absolute; right: -2px; top: -4px; border: 5px solid transparent; border-left: 7px solid #00b8e6; border-right: 0; }
  .trajetoria .hoje { background: linear-gradient(135deg, #0F3A7D, #066db7); color: #fff; padding: 7px 14px; border-radius: 999px; font-weight: 600; box-shadow: 0 8px 22px rgba(15,58,125,.25); }
  .trajetoria .hoje b { color: #7fe9ff; }

  /* Sistemas */
  .node { position: absolute; width: 236px; height: 70px; display: flex; align-items: center; gap: 13px; padding: 0 16px;
    background: rgba(255,255,255,.88); border: 1px solid rgba(15,58,125,.12); border-radius: 16px;
    box-shadow: 0 12px 30px rgba(15,58,125,.10), inset 0 1px 0 #fff; }
  .node .ic { flex: none; width: 42px; height: 42px; border-radius: 12px; padding: 10px; color: #fff;
    background: linear-gradient(135deg, #0F3A7D, #066db7); box-shadow: 0 6px 16px rgba(6,109,183,.35); }
  .node b { display: block; font-family: Poppins; font-weight: 700; font-size: 17px; color: #0F3A7D; line-height: 1.15; }
  .node span { font-size: 12px; color: #066db7; font-weight: 600; }

  /* Notebook */
  .laptop { position: absolute; left: 404px; top: 128px; width: 392px; }
  .screen { height: 246px; border-radius: 16px 16px 4px 4px; background: #0b1f44; padding: 9px; box-shadow: 0 30px 60px rgba(15,58,125,.30); }
  .screen-in { position: relative; height: 100%; border-radius: 8px; overflow: hidden;
    background: linear-gradient(160deg, #0f2d5e 0%, #0b2350 60%, #0a1d42 100%); }
  .topbar { height: 22px; display: flex; align-items: center; gap: 5px; padding: 0 10px; background: rgba(255,255,255,.06); }
  .topbar i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
  .topbar em { margin-left: 8px; font-style: normal; font-size: 9px; letter-spacing: .08em; color: rgba(255,255,255,.55); font-weight: 600; }
  .side { position: absolute; left: 0; top: 22px; bottom: 0; width: 38px; background: rgba(255,255,255,.04); display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 12px; }
  .side i { width: 16px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.2); }
  .side i:first-child { background: #00D9FF; }
  .kpis { position: absolute; left: 48px; right: 10px; top: 32px; display: flex; gap: 8px; }
  .kpi { flex: 1; height: 44px; border-radius: 7px; background: rgba(255,255,255,.07); padding: 7px 8px; }
  .kpi i { display: block; height: 4px; width: 50%; border-radius: 2px; background: rgba(255,255,255,.25); margin-bottom: 8px; }
  .kpi u { display: block; height: 8px; border-radius: 3px; background: linear-gradient(90deg, #00D9FF, #3b82f6); }
  .chart { position: absolute; left: 48px; right: 10px; bottom: 10px; height: 110px; border-radius: 7px; background: rgba(255,255,255,.05); }
  .core { position: absolute; left: 50%; top: 54%; width: 112px; height: 112px; margin: -56px 0 0 -42px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,217,255,.28), transparent 70%); display: grid; place-items: center; }
  .core img { width: 86px; height: 86px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(0,217,255,.35), 0 0 34px rgba(0,217,255,.55); }
  .base { height: 16px; margin: 0 -26px; border-radius: 3px 3px 14px 14px; background: linear-gradient(180deg, #d6e2f2, #aebfd8); box-shadow: 0 16px 30px rgba(15,58,125,.22); position: relative; }
  .base::before { content: ""; position: absolute; left: 50%; top: 0; width: 70px; height: 6px; margin-left: -35px; border-radius: 0 0 6px 6px; background: #9fb2cf; }

  /* Celular */
  .phone { position: absolute; left: 752px; top: 262px; width: 96px; height: 178px; border-radius: 18px; background: #0b1f44; padding: 6px;
    box-shadow: 0 22px 44px rgba(15,58,125,.35); }
  .phone-in { height: 100%; border-radius: 13px; background: linear-gradient(180deg, #f4f8ff, #e6effb); padding: 14px 8px 8px; }
  .phone-in .notch { width: 30px; height: 4px; border-radius: 3px; background: #c8d5e8; margin: -8px auto 9px; }
  .row { display: flex; align-items: center; gap: 5px; background: #fff; border-radius: 6px; padding: 5px; margin-bottom: 5px; box-shadow: 0 2px 6px rgba(15,58,125,.08); }
  .row .ok { width: 13px; height: 13px; border-radius: 50%; background: #10b981; color: #fff; padding: 2px; flex: none; }
  .row i { height: 4px; border-radius: 2px; background: #c3d1e6; flex: 1; }
  .alerta { display: flex; align-items: center; gap: 5px; border-radius: 6px; padding: 5px; background: linear-gradient(135deg, #0F3A7D, #066db7); }
  .alerta .b { width: 13px; height: 13px; color: #7fe9ff; flex: none; }
  .alerta i { height: 4px; border-radius: 2px; background: rgba(255,255,255,.5); flex: 1; }

  /* Rodapé da arte */
  .tagline { position: absolute; left: 0; right: 0; top: 520px; text-align: center; font-family: Poppins; font-weight: 600; font-size: 13px; letter-spacing: .22em; color: #0F3A7D; }
  .tagline span { color: #066db7; }
  .pilares { position: absolute; left: 80px; right: 80px; top: 554px; height: 78px; display: flex; align-items: center;
    background: rgba(255,255,255,.9); border: 1px solid rgba(15,58,125,.10); border-radius: 18px; box-shadow: 0 14px 34px rgba(15,58,125,.10); }
  .pilar { flex: 1; display: flex; align-items: center; justify-content: center; gap: 11px; height: 44px; }
  .pilar + .pilar { border-left: 1px solid rgba(15,58,125,.12); }
  .pilar .ic { width: 38px; height: 38px; border-radius: 50%; padding: 9px; color: #0F3A7D; background: rgba(0,217,255,.16); border: 1px solid rgba(0,184,230,.35); flex: none; }
  .pilar b { font-family: Poppins; font-weight: 600; font-size: 13.5px; color: #0F3A7D; line-height: 1.2; }
  .barras { position: absolute; right: 22px; bottom: 120px; display: flex; align-items: flex-end; gap: 8px; opacity: .22; }
  .barras i { width: 16px; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, #3b82f6, transparent); }

  .brand { left: 0; right: 0; top: 26px; justify-content: center; }
  .trajetoria { left: 0; right: 0; top: 104px; justify-content: center; font-size: 14px; gap: 8px; flex-direction: column; }
  .trajetoria .seta { display: none; }
  .trajetoria .seta { width: 26px; }
  .laptop { left: 110px; top: 210px; width: 340px; }
  .screen { height: 200px; }
  .chart { height: 84px; }
  .phone { left: 420px; top: 282px; width: 80px; height: 172px; }
  .phone-in { padding: 12px 6px 6px; }
  .row { padding: 4px; margin-bottom: 4px; }
  .grid-sis { position: absolute; left: 20px; right: 20px; top: 486px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .node { position: relative; width: auto; height: 76px; padding: 0 12px; gap: 12px; border-radius: 14px; }
  .node:last-child { grid-column: 1 / -1; width: calc(50% - 6px); justify-self: center; }
  .node .ic { width: 46px; height: 46px; padding: 11px; }
  .node b { font-size: 22px; }
  .node span { font-size: 15px; }
  .tagline { top: 926px; font-size: 14px; letter-spacing: .14em; }
  .pilares { left: 20px; right: 20px; top: 960px; height: 124px; flex-wrap: wrap; padding: 8px 6px; }
  .pilar { flex: 0 0 50%; height: 54px; justify-content: flex-start; padding-left: 16px; gap: 10px; }
  .pilar + .pilar { border-left: 0; }
  .pilar .ic { width: 40px; height: 40px; padding: 9px; }
  .pilar b { font-size: 16px; }
</style></head>
<body>
<div class="stage" id="stage">
  <div class="grid"></div>
  <div class="dots" style="left:24px;top:448px;height:28px;opacity:.3"></div><div class="dots" style="right:24px;top:448px;height:28px;opacity:.3"></div>
        
  
  <div class="brand">
    <img src="logo.webp" alt="" />
    <div><b>GRUPO GERMANO</b><span>Tecnologia e sistemas para gestão empresarial</span></div>
  </div>
  <div class="trajetoria">
    <span class="antes"><b>2018</b> · Origem na consultoria empresarial</span>
    <span class="seta"></span>
    <span class="hoje"><b>Hoje</b> · Tecnologia &amp; Sistemas</span>
  </div>

  <div class="laptop">
    <div class="screen"><div class="screen-in">
      <div class="topbar"><i></i><i></i><i></i><em>G-TECH · PAINEL DE GESTÃO</em></div>
      <div class="side"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="kpis">
        <div class="kpi"><i></i><u style="width:78%"></u></div>
        <div class="kpi"><i></i><u style="width:62%"></u></div>
        <div class="kpi"><i></i><u style="width:88%"></u></div>
      </div>
      <svg class="chart" viewBox="0 0 334 110" preserveAspectRatio="none">
        <g fill="rgba(0,217,255,.22)">
          <rect x="14" y="70" width="16" height="32" rx="3"/><rect x="40" y="58" width="16" height="44" rx="3"/>
          <rect x="66" y="64" width="16" height="38" rx="3"/><rect x="250" y="46" width="16" height="56" rx="3"/>
          <rect x="276" y="34" width="16" height="68" rx="3"/><rect x="302" y="20" width="16" height="82" rx="3"/>
        </g>
        <polyline points="10,90 60,78 110,82 160,60 210,64 260,40 324,18" fill="none" stroke="#00D9FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="core"><img src="logoGtech.webp" alt="" /></div>
    </div></div>
    <div class="base"></div>
  </div>

  <div class="phone"><div class="phone-in">
    <div class="notch"></div>
    <div class="row"><span class="ok" data-i="check"></span><i></i></div>
    <div class="row"><span class="ok" data-i="check"></span><i style="flex:.7"></i></div>
    <div class="row"><span class="ok" data-i="check"></span><i></i></div>
    <div class="row"><span class="ok" data-i="check"></span><i style="flex:.6"></i></div>
    <div class="alerta"><span class="b" data-i="bell"></span><i></i></div>
    <div class="row" style="margin-top:5px"><span class="ok" style="background:#3b82f6" data-i="trending-up"></span><i style="flex:.8"></i></div>
  </div></div>

  
  <div class="grid-sis" id="nodes"></div>
  <div class="tagline">ECOSSISTEMA G-TECH <span>·</span> SISTEMAS INTEGRADOS</div>
  <div class="pilares">
    <div class="pilar"><span class="ic" data-i="code-xml"></span><b>Desenvolvimento<br/>de sistemas</b></div>
    <div class="pilar"><span class="ic" data-i="zap"></span><b>Automação<br/>de processos</b></div>
    <div class="pilar"><span class="ic" data-i="layout-dashboard"></span><b>Gestão<br/>inteligente</b></div>
    <div class="pilar"><span class="ic" data-i="network"></span><b>Integração<br/>empresarial</b></div>
  </div>
</div>
<script>
  const svgIcon = n => `<svg class="icon" viewBox="0 0 24 24">${ICONS[n]}</svg>`;
  const sistemas = [["G-PASS","Segurança de acessos","key-round"],["G-CHECK","Rotinas operacionais","clipboard-check"],["G-CLIN","Gestão clínica","stethoscope"],["G-ADV","Gestão jurídica","scale"],["G-CRM","Vendas e clientes","handshake"],["G-POINT","Ponto e jornada","clock"],["G-PDV","Varejo e caixa","shopping-cart"],["FLOW","Projetos e tarefas","workflow"],["BPO","Gestão financeira","landmark"]];
  const nodes=document.getElementById("nodes");
  sistemas.forEach(([n,s,i])=>nodes.insertAdjacentHTML("beforeend",`<div class="node"><span class="ic">${svgIcon(i)}</span><div><b>${n}</b><span>${s}</span></div></div>`));
  document.querySelectorAll("[data-i]").forEach(el=>el.innerHTML=svgIcon(el.dataset.i));
</script></body></html>
